<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Shoot the Heart Birthday Wish</title>
  <style>
    * {
      box-sizing: border-box;
      touch-action: none;
    }

    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #fce4ec, #f8bbd0);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .game-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      height: 600px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Target Heart */
    .target-heart {
      position: absolute;
      top: 50px;
      font-size: 70px;
      user-select: none;
      transition: transform 0.2s ease;
      animation: float 2s infinite alternate ease-in-out;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      100% { transform: translateY(15px); }
    }

    /* Canvas for Bow and Arrow */
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    .instruction {
      position: absolute;
      bottom: 20px;
      font-size: 13px;
      color: #888;
      font-weight: bold;
      letter-spacing: 1px;
      z-index: 1;
      text-align: center;
    }

    /* Birthday Wish Card Pop-up */
    .wish-card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      width: 85%;
      background: #ffffff;
      border: 3px solid #ff4b6e;
      border-radius: 20px;
      padding: 25px 20px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(255, 75, 110, 0.3);
      z-index: 10;
      opacity: 0;
      transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
    }

    .wish-card.show {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    .wish-card h1 {
      color: #ff4b6e;
      margin: 10px 0;
      font-size: 28px;
    }

    .wish-card p {
      color: #444;
      font-size: 15px;
      line-height: 1.5;
    }

    .restart-btn {
      margin-top: 15px;
      background: #ff4b6e;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="target-heart" id="targetHeart">💖</div>
    <canvas id="gameCanvas"></canvas>
    <div class="instruction">🏹 তীরটি টেনে ধরে হার্টের দিকে তাক করে ছেড়ে দিন!</div>

    <div class="wish-card" id="wishCard">
      <div style="font-size: 50px;">🎉🎂</div>
      <h1>Happy Birthday!</h1>
      <p>আপনার শুভ জন্মদিনে অনেক অনেক ভালোবাসা ও শুভেচ্ছা! আজকের দিনটি অনেক আনন্দে কাটুক! ✨💖</p>
      <button class="restart-btn" onclick="resetGame()">আবার খেলুন 🏹</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const targetHeart = document.getElementById('targetHeart');
    const wishCard = document.getElementById('wishCard');

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    resizeCanvas();

    // Game Variables
    const bowPos = { x: canvas.width / 2, y: canvas.height - 100 };
    let arrowPos = { x: bowPos.x, y: bowPos.y };
    let isDragging = false;
    let dragPos = { x: bowPos.x, y: bowPos.y };
    let arrowVelocity = { x: 0, y: 0 };
    let isFired = false;
    let isHit = false;

    // Get Target Position
    function getTargetRect() {
      const rect = targetHeart.getBoundingClientRect();
      const containerRect = canvas.getBoundingClientRect();
      return {
        x: rect.left - containerRect.left + rect.width / 2,
        y: rect.top - containerRect.top + rect.height / 2,
        radius: rect.width / 2
      };
    }

    // Touch / Mouse Events
    function getEventPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function startDrag(e) {
      if (isFired || isHit) return;
      const pos = getEventPos(e);
      const dist = Math.hypot(pos.x - bowPos.x, pos.y - bowPos.y);
      if (dist < 60) {
        isDragging = true;
        dragPos = pos;
      }
    }

    function moveDrag(e) {
      if (!isDragging) return;
      dragPos = getEventPos(e);
      // Limit pull distance
      const maxPull = 100;
      const dx = dragPos.x - bowPos.x;
      const dy = dragPos.y - bowPos.y;
      const dist = Math.hypot(dx, dy);
      if (dist > maxPull) {
        dragPos.x = bowPos.x + (dx / dist) * maxPull;
        dragPos.y = bowPos.y + (dy / dist) * maxPull;
      }
    }

    function endDrag() {
      if (!isDragging) return;
      isDragging = false;
      isFired = true;
      const dx = bowPos.x - dragPos.x;
      const dy = bowPos.y - dragPos.y;
      arrowVelocity = { x: dx * 0.25, y: dy * 0.25 };
    }

    canvas.addEventListener('mousedown', startDrag);
    canvas.addEventListener('mousemove', moveDrag);
    window.addEventListener('mouseup', endDrag);

    canvas.addEventListener('touchstart', startDrag);
    canvas.addEventListener('touchmove', moveDrag);
    window.addEventListener('touchend', endDrag);

    // Update & Render
    function update() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw Bow
      ctx.beginPath();
      ctx.arc(bowPos.x, bowPos.y, 40, Math.PI * 0.2, Math.PI * 0.8, false);
      ctx.strokeStyle = '#8d6e63';
      ctx.lineWidth = 6;
      ctx.stroke();

      // Draw Bow String & Arrow
      if (!isFired) {
        const pullX = isDragging ? dragPos.x : bowPos.x;
        const pullY = isDragging ? dragPos.y : bowPos.y;

        // String
        ctx.beginPath();
        ctx.moveTo(bowPos.x - 35, bowPos.y + 15);
        ctx.lineTo(pullX, pullY);
        ctx.lineTo(bowPos.x + 35, bowPos.y + 15);
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Arrow Body
        const angle = Math.atan2(bowPos.y - pullY, bowPos.x - pullX);
        drawArrow(pullX, pullY, angle);
      } else {
        // String resting
        ctx.beginPath();
        ctx.moveTo(bowPos.x - 35, bowPos.y + 15);
        ctx.lineTo(bowPos.x + 35, bowPos.y + 15);
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Arrow Moving
        if (!isHit) {
          arrowPos.x += arrowVelocity.x;
          arrowPos.y += arrowVelocity.y;

          const angle = Math.atan2(arrowVelocity.y, arrowVelocity.x);
          drawArrow(arrowPos.x, arrowPos.y, angle);

          // Check Collision
          const target = getTargetRect();
          const distToTarget = Math.hypot(arrowPos.x - target.x, arrowPos.y - target.y);
          if (distToTarget < target.radius) {
            isHit = true;
            targetHeart.style.transform = 'scale(1.4)';
            setTimeout(() => {
              wishCard.classList.add('show');
            }, 300);
          }

          // Reset if off-screen
          if (arrowPos.y < 0 || arrowPos.x < 0 || arrowPos.x > canvas.width || arrowPos.y > canvas.height) {
            setTimeout(resetArrow, 300);
          }
        }
      }

      requestAnimationFrame(update);
    }

    function drawArrow(x, y, angle) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);

      // Arrow Shaft
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(60, 0);
      ctx.strokeStyle = '#3e2723';
      ctx.lineWidth = 4;
      ctx.stroke();

      // Arrow Head
      ctx.beginPath();
      ctx.moveTo(60, 0);
      ctx.lineTo(45, -8);
      ctx.lineTo(45, 8);
      ctx.closePath();
      ctx.fillStyle = '#ff4b6e';
      ctx.fill();

      ctx.restore();
    }

    function resetArrow() {
      isFired = false;
      arrowPos = { x: bowPos.x, y: bowPos.y };
    }

    function resetGame() {
      isHit = false;
      wishCard.classList.remove('show');
      targetHeart.style.transform = 'scale(1)';
      resetArrow();
    }

    update();
  </script>
</body>
</html>
