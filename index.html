<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Epic Birthday Archery Game</title>
  <style>
    * {
      box-sizing: border-box;
      touch-action: none;
    }

    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      color: #fff;
    }

    .game-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 650px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 25px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Floating Target Heart */
    .target-heart {
      position: absolute;
      top: 60px;
      font-size: 75px;
      user-select: none;
      filter: drop-shadow(0 0 15px #ff2e63);
      animation: floatBeat 2s infinite alternate ease-in-out;
      z-index: 1;
    }

    @keyframes floatBeat {
      0% { transform: translateY(0) scale(1); }
      50% { transform: translateY(10px) scale(1.08); }
      100% { transform: translateY(20px) scale(1); }
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    .instruction {
      position: absolute;
      bottom: 25px;
      font-size: 14px;
      color: #e94560;
      background: rgba(0,0,0,0.4);
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: 600;
      letter-spacing: 0.5px;
      z-index: 1;
      border: 1px solid rgba(233, 69, 96, 0.3);
    }

    /* Celebration Wish Card Pop-up */
    .wish-card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      width: 85%;
      background: linear-gradient(145deg, #ffffff, #fff5f7);
      border-radius: 25px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(233, 69, 96, 0.4);
      z-index: 10;
      opacity: 0;
      transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      color: #333;
    }

    .wish-card.show {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    .wish-card h1 {
      color: #e94560;
      margin: 10px 0;
      font-size: 28px;
      font-weight: 800;
    }

    .wish-card p {
      color: #555;
      font-size: 15px;
      line-height: 1.6;
    }

    .restart-btn {
      margin-top: 18px;
      background: linear-gradient(45deg, #ff2e63, #e94560);
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 25px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(233, 69, 96, 0.4);
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="target-heart" id="targetHeart">💖</div>
    <canvas id="gameCanvas"></canvas>
    <div class="instruction">🏹 তীরটি টেনে ধরে হার্টের দিকে লক্ষ্য করে ছেড়ে দিন!</div>

    <div class="wish-card" id="wishCard">
      <div style="font-size: 60px;">🎉🎂✨</div>
      <h1>Happy Birthday!</h1>
      <p>আপনার বিশেষ দিনে জানাই অফুরন্ত ভালোবাসা ও অনেক শুভকামনা! প্রতিটি দিন কাটুক সাফল্য ও হাসিতে! 💖🎈</p>
      <button class="restart-btn" onclick="resetGame()">আবার খেলুন 🏹</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const targetHeart = document.getElementById('targetHeart');
    const wishCard = document.getElementById('wishCard');

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    resizeCanvas();

    // Bow & Arrow Config
    const bowPos = { x: canvas.width / 2, y: canvas.height - 110 };
    let arrowPos = { x: bowPos.x, y: bowPos.y };
    let isDragging = false;
    let dragPos = { x: bowPos.x, y: bowPos.y };
    let arrowVelocity = { x: 0, y: 0 };
    let isFired = false;
    let isHit = false;

    // Particle Effect Array
    let particles = [];

    function createConfetti(x, y) {
      const colors = ['#ff2e63', '#08d9d6', '#ffde7d', '#fce38a', '#ff6bcb'];
      for (let i = 0; i < 60; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 12,
          vy: (Math.random() - 0.7) * 12,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          gravity: 0.2
        });
      }
    }

    function getTargetRect() {
      const rect = targetHeart.getBoundingClientRect();
      const containerRect = canvas.getBoundingClientRect();
      return {
        x: rect.left - containerRect.left + rect.width / 2,
        y: rect.top - containerRect.top + rect.height / 2,
        radius: rect.width / 2
      };
    }

    function getEventPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function startDrag(e) {
      if (isFired || isHit) return;
      const pos = getEventPos(e);
      if (Math.hypot(pos.x - bowPos.x, pos.y - bowPos.y) < 70) {
        isDragging = true;
        dragPos = pos;
      }
    }

    function moveDrag(e) {
      if (!isDragging) return;
      dragPos = getEventPos(e);
      const maxPull = 90;
      const dx = dragPos.x - bowPos.x;
      const dy = dragPos.y - bowPos.y;
      const dist = Math.hypot(dx, dy);
      if (dist > maxPull) {
        dragPos.x = bowPos.x + (dx / dist) * maxPull;
        dragPos.y = bowPos.y + (dy / dist) * maxPull;
      }
    }

    function endDrag() {
      if (!isDragging) return;
      isDragging = false;
      isFired = true;
      const dx = bowPos.x - dragPos.x;
      const dy = bowPos.y - dragPos.y;
      arrowVelocity = { x: dx * 0.28, y: dy * 0.28 };
    }

    canvas.addEventListener('mousedown', startDrag);
    canvas.addEventListener('mousemove', moveDrag);
    window.addEventListener('mouseup', endDrag);

    canvas.addEventListener('touchstart', startDrag);
    canvas.addEventListener('touchmove', moveDrag);
    window.addEventListener('touchend', endDrag);

    function update() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw Aim Line
      if (isDragging) {
        ctx.beginPath();
        ctx.moveTo(bowPos.x, bowPos.y);
        ctx.lineTo(bowPos.x + (bowPos.x - dragPos.x) * 2, bowPos.y + (bowPos.y - dragPos.y) * 2);
        ctx.setLineDash([5, 5]);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // Draw Bow
      ctx.beginPath();
      ctx.arc(bowPos.x, bowPos.y, 45, Math.PI * 0.15, Math.PI * 0.85, false);
      ctx.strokeStyle = '#e94560';
      ctx.lineWidth = 7;
      ctx.stroke();

      // String & Arrow
      if (!isFired) {
        const pullX = isDragging ? dragPos.x : bowPos.x;
        const pullY = isDragging ? dragPos.y : bowPos.y;

        ctx.beginPath();
        ctx.moveTo(bowPos.x - 40, bowPos.y + 10);
        ctx.lineTo(pullX, pullY);
        ctx.lineTo(bowPos.x + 40, bowPos.y + 10);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        const angle = Math.atan2(bowPos.y - pullY, bowPos.x - pullX);
        drawArrow(pullX, pullY, angle);
      } else {
        ctx.beginPath();
        ctx.moveTo(bowPos.x - 40, bowPos.y + 10);
        ctx.lineTo(bowPos.x + 40, bowPos.y + 10);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        if (!isHit) {
          arrowPos.x += arrowVelocity.x;
          arrowPos.y += arrowVelocity.y;

          const angle = Math.atan2(arrowVelocity.y, arrowVelocity.x);
          drawArrow(arrowPos.x, arrowPos.y, angle);

          const target = getTargetRect();
          if (Math.hypot(arrowPos.x - target.x, arrowPos.y - target.y) < target.radius) {
            isHit = true;
            createConfetti(target.x, target.y);
            targetHeart.style.transform = 'scale(1.6) rotate(15deg)';
            targetHeart.style.opacity = '0.8';
            setTimeout(() => {
              wishCard.classList.add('show');
            }, 500);
          }

          if (arrowPos.y < 0 || arrowPos.x < 0 || arrowPos.x > canvas.width || arrowPos.y > canvas.height) {
            setTimeout(resetArrow, 300);
          }
        }
      }

      // Render Particles
      particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.alpha -= 0.015;

        ctx.save();
        ctx.globalAlpha = Math.max(p.alpha, 0);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        if (p.alpha <= 0) particles.splice(index, 1);
      });

      requestAnimationFrame(update);
    }

    function drawArrow(x, y, angle) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(65, 0);
      ctx.strokeStyle = '#fce38a';
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(65, 0);
      ctx.lineTo(48, -9);
      ctx.lineTo(48, 9);
      ctx.closePath();
      ctx.fillStyle = '#ff2e63';
      ctx.fill();

      ctx.restore();
    }

    function resetArrow() {
      isFired = false;
      arrowPos = { x: bowPos.x, y: bowPos.y };
    }

    function resetGame() {
      isHit = false;
      wishCard.classList.remove('show');
      targetHeart.style.transform = 'none';
      targetHeart.style.opacity = '1';
      particles = [];
      resetArrow();
    }

    update();
  </script>
</body>
</html>
