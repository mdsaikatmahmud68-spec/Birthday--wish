<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Birthday Wish</title>
  <style>
    :root {
      --bg-color: #fdf2f2;
      --accent-color: #ff4b6e;
      --ink: #2b2b2b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 360px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      padding: 30px 20px;
      text-align: center;
    }

    /* Target Icon & Pulse Animation */
    .heart-target {
      font-size: 60px;
      cursor: pointer;
      user-select: none;
      display: inline-block;
      transition: transform 0.2s ease;
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.15); }
    }

    .instruction {
      font-size: 12px;
      letter-spacing: 2px;
      color: #888;
      margin-top: 10px;
      font-weight: bold;
    }

    /* Animated Wish Box */
    .wish-container {
      margin-top: 25px;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.8s ease-in-out;
      visibility: hidden;
    }

    .wish-container.is-in {
      opacity: 1;
      transform: translateY(0);
      visibility: visible;
    }

    .sub-text {
      font-style: italic;
      font-size: 14px;
      color: #666;
    }

    .main-title {
      color: var(--accent-color);
      font-size: 30px;
      margin: 10px 0;
    }

    .wishing-text {
      font-size: 14px;
      color: var(--ink);
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Clickable Heart Target -->
    <div class="heart-target" id="heartBtn">💖</div>
    <div style="font-size: 24px; margin-top: 5px;">🏹</div>
    <div class="instruction">TAP THE HEART TO UNLOCK WISH</div>

    <!-- Hidden Message Container -->
    <div class="wish-container" id="wishCard">
      <span class="sub-text">a little something, for you</span>
      <h1 class="main-title">Happy Birthday!</h1>
      <p class="wishing-text">Here's to a year that blooms with happiness ✨</p>
    </div>
  </div>

  <script>
    const heartBtn = document.getElementById('heartBtn');
    const wishCard = document.getElementById('wishCard');

    // Reveal Animation Logic
    heartBtn.addEventListener('click', () => {
      wishCard.classList.add('is-in');
      heartBtn.style.transform = 'scale(1.4)';
      setTimeout(() => {
        heartBtn.style.transform = 'scale(1)';
      }, 300);
    });
  </script>

</body>
</html>
